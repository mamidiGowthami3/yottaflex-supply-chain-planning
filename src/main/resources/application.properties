# ========================================================
# YottaFlex Supply Chain Planning System Configuration
# ========================================================

spring.application.name=yottaflex-supply-chain

# --------------------------------------------------------
# MySQL 8 Database Configuration
# Strictly relies on environment variables for credentials.
# No hardcoded passwords or insecure defaults.
# --------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/yottaflex_supply_chain?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# --------------------------------------------------------
# JPA / Hibernate Configuration
# Automatically creates and updates schema tables for all 11 entities.
# --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --------------------------------------------------------
# Server & Web Configuration
# --------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/

# --------------------------------------------------------
# Spring Boot Actuator & Health Check
# --------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# --------------------------------------------------------
# Logging Configuration
# Safe logging levels preventing sensitive parameter exposure
# --------------------------------------------------------
logging.level.root=INFO
logging.level.com.yottaflex.supplychain=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
